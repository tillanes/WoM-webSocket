<script src="/socket.io/socket.io.js"></script>
<script>
  let userToken = localStorage.getItem('userToken');
  while (!userToken) {
    alert('No JWT token found. Please enter your token.');
    userToken = prompt('Enter your JWT token:')?.trim();
    if (userToken) {
      localStorage.setItem('userToken', userToken);
    }
  }

  const socket = io();
</script>
